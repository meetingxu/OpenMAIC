events { worker_connections 1024; }
http {
  # Only Caddy's fixed address can supply client IPs. The app has no host port.
  set_real_ip_from 172.30.90.10;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  map $host $trial_bucket { default trial; }
  limit_req_zone $binary_remote_addr zone=trial_rate:10m rate=60r/m;
  limit_conn_zone $binary_remote_addr zone=trial_client:10m;
  limit_conn_zone $trial_bucket zone=trial_total:1m;
  server {
    listen 8080;
    client_max_body_size 20m;
    limit_req_status 429;
    limit_conn_status 429;
    location /api/ {
      limit_req zone=trial_rate burst=20 nodelay;
      limit_conn trial_client 4;
      limit_conn trial_total 8;
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
    }
    location / {
      proxy_pass http://app:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
